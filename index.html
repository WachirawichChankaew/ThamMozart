<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ThamMozart</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">
        <div id="notification-area"></div>
        <div id="home" class="screen active">
            <img class="ring" src="assets/Vinyl.png" alt="rings" />
            <div class="card-home">
                <div class="ticket">
                    <div class="form-group-home">
                        <div class="form-group-home-inside">
                            <span class="banner">ThamMozart</span>
                            <span class="logo-text">
                                <blockquote>
                                </blockquote><br><br>
                                -ThamMozart
                            </span>

                        </div>
                    </div>
                </div>
                <div class="card-head">
                    <div class="card-head-inside">
                        <label class="home-name">Enter Name</label><input type="text" id="username"
                            placeholder="Username" onkeypress="if(event.key==='Enter') login()">
                        <div class="button">
                            <div class="button-outline" onclick="login()">Submit</div>
                        </div>

                    </div>
                </div>

            </div>
        </div>

        <div id="lobby" class="screen">
            <div class="top-bar">
                <div style="display: flex; align-items: center; gap: 10px;">
                    <button onclick="leaveLobby()" style="background:transparent; font-size: 20px;">⬅</button>
                    <h2 style="margin:0;">Lobby</h2>
                </div>

                <div style="display: flex; align-items: center; gap: 10px;">
                    <button onclick="showCreateModal()">+ Create Room</button>
                </div>
            </div>
            <div class="room-list" id="roomList"></div>
        </div>


        <div id="room" class="screen">

            <div class="top-bar">
                <div style="display: flex; align-items: center; gap: 10px;">
                    <button onclick="leaveRoom()" style="background:transparent; font-size: 20px;">⬅</button>
                    <h2 id="roomTitle" style="margin:0;">Room</h2>
                </div>
                <div style="display: flex; align-items: center; gap: 10px;">
                    <label style="font-size: 0.8em; color: #aaa;">Instrument:</label>

                    <input type="hidden" id="roomInstSelect" value="Piano">

                    <div class="instrument-selector room-top-selector">
                        <div class="inst-option active" data-inst="Piano" onclick="selectRoomInstrument('Piano', this)">
                            <img src="assets/Select-instrument/piano.webp" class="inst-img-small"><br>Piano
                        </div>
                        <div class="inst-option" data-inst="Guitar" onclick="selectRoomInstrument('Guitar', this)">
                            <img src="assets/Select-instrument/guitar.png" class="inst-img-small"><br>Guitar
                        </div>
                        <div class="inst-option" data-inst="Bass" onclick="selectRoomInstrument('Bass', this)">
                            <img src="assets/Select-instrument/bass.png" class="inst-img-small"><br>Bass
                        </div>
                        <div class="inst-option" data-inst="Drum" onclick="selectRoomInstrument('Drum', this)">
                            <img src="assets/Select-instrument/drum.png" class="inst-img-small"><br>Drum
                        </div>
                        <div class="inst-option" data-inst="Singer" onclick="selectRoomInstrument('Singer', this)">
                            <img src="assets/Select-instrument/microphone.png" class="inst-img-small"><br>Singer
                        </div>
                    </div>

                </div>
            </div>

            <div class="room-content">
                <div class="side-panel">
                    <h4 style="margin:0 0 10px 0; color:#888;">MEMBERS</h4>
                    <div id="memberList"></div>
                </div>
                <div class="controls">
                    <div class="circle-btn" id="micBtn" onclick="toggleMic()" title="Mic">
                        <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor">
                            <path
                                d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5-3c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z" />
                        </svg>
                    </div>

                    <div class="circle-btn" id="sustainBtn" onclick="toggleSustain()" title="Sustain">
                        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor"
                            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline>
                        </svg>
                    </div>
                </div>
                <div class="chat-panel">
                    <div class="chat-history" id="chatHistory"></div>
                    <div class="chat-input"><input type="text" id="chatMsg" placeholder="พิมพ์ข้อความ"
                            onkeypress="handleChat(event)"><button onclick="sendChat()">➤</button></div>
                </div>

            </div>

            <div class="instrument-area" id="instrumentDeck"></div>
            <div style="text-align: center; font-size: 0.8em; color: #666; padding: 5px;"><span id="key-hint"></span>
            </div>
        </div>

        <div id="createModal" class="modal">
            <div class="modal-content">
                <h3 class="modal-lebel">🏠︎ Create Room</h3>
                <div class="modal-form">
                    <div class="form-group"><label>Name</label><input type="text" id="newRoomName"></div>
                    <div class="form-group"><label>Password</label><input type="text" id="newRoomPass"></div>
                    <div class="form-group"><label>Capacity</label><input type="number" id="newRoomCap" value="5"
                            min="1" max="10">
                    </div>
                    <div class="form-group">
                        <label>Instrument</label>

                        <input type="hidden" id="createInst" value="Piano">
                        <div class="instrument-selector">
                            <div class="inst-option active" onclick="selectInstrument('createInst', 'Piano', this)">
                                <img src="assets/Select-instrument/piano.webp" alt="Piano" class="inst-img"><br>Piano
                            </div>
                            <div class="inst-option" onclick="selectInstrument('createInst', 'Guitar', this)">
                                <img src="assets/Select-instrument/guitar.png" alt="Guitar" class="inst-img"><br>Guitar
                            </div>
                            <div class="inst-option" onclick="selectInstrument('createInst', 'Bass', this)">
                                <img src="assets/Select-instrument/bass.png" alt="Bass" class="inst-img"><br>Bass
                            </div>
                            <div class="inst-option" onclick="selectInstrument('createInst', 'Drum', this)">
                                <img src="assets/Select-instrument/drum.png" alt="Drum" class="inst-img"><br>Drum
                            </div>
                            <div class="inst-option" onclick="selectInstrument('createInst', 'Singer', this)">
                                <img src="assets/Select-instrument/microphone.png" alt="Singer"
                                    class="inst-img"><br>Singer
                            </div>
                        </div>
                    </div>
                    <div style="text-align: right; margin-top: 20px;"><button class="red"
                            onclick="closeModals()">Cancel</button> <button onclick="createRoom()">Create</button></div>
                </div>
            </div>
        </div>

        <div id="joinModal" class="modal">
            <div class="modal-content">
                <h3 class="modal-lebel">Join Room</h3>
                <div class="modal-form">


                    <div class="form-group" id="passField"><label>Password</label><input type="password" id="joinPass">
                    </div>
                    <div class="form-group">
                        <label>Instrument</label>
                        <input type="hidden" id="joinInst" value="Piano">
                        <div class="instrument-selector">
                            <div class="inst-option active" onclick="selectInstrument('joinInst', 'Piano', this)">
                                <img src="assets/Select-instrument/piano.webp" alt="Piano" class="inst-img"><br>Piano
                            </div>
                            <div class="inst-option" onclick="selectInstrument('joinInst', 'Guitar', this)">
                                <img src="assets/Select-instrument/guitar.png" alt="Guitar" class="inst-img"><br>Guitar
                            </div>
                            <div class="inst-option" onclick="selectInstrument('joinInst', 'Bass', this)">
                                <img src="assets/Select-instrument/bass.png" alt="Bass" class="inst-img"><br>Bass
                            </div>
                            <div class="inst-option" onclick="selectInstrument('joinInst', 'Drum', this)">
                                <img src="assets/Select-instrument/drum.png" alt="Drum" class="inst-img"><br>Drum
                            </div>
                            <div class="inst-option" onclick="selectInstrument('joinInst', 'Singer', this)">
                                <img src="assets/Select-instrument/microphone.png" alt="Singer"
                                    class="inst-img"><br>Singer
                            </div>
                        </div>
                    </div>
                    <div style="text-align: right; margin-top: 20px;"><button class="red"
                            onclick="closeModals()">Cancel</button> <button onclick="confirmJoin()">Join</button></div>
                </div>
            </div>
        </div>
    </div>
    <script src="client.js"></script>
</body>

</html>
